<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DardlashAI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="avatar"></div>
  <div id="overlay">
    <p id="status">Загрузка…</p>
    <p id="helpline" hidden></p>
    <p id="reply"></p>
    <div id="composer">
      <textarea id="text" rows="2" placeholder=""></textarea>
      <div id="actions">
        <button type="button" id="mic" aria-label="mic">🎙</button>
        <button type="button" id="send">➤</button>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
